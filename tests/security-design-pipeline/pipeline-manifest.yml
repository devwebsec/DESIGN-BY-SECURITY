version: "1.0"
name: security-design-pipeline
lifecycle:
  - DESIGN
  - BUILD
  - DEPLOY
  - DETECT
  - RESPOND
  - LEARN
  - REDESIGN
orchestrators:
  architecture: design-by-security
  operations: security-copilot-v4
contracts:
  architecture_to_operations: design-by-security/DESIGN-BY-SECURITY-ADAPTER.md
  operations_to_architecture: skills/security-copilot/DESIGN-BY-SECURITY-ADAPTER.md
required_artifacts:
  - intent
  - architecture
  - assets
  - data_flows
  - trust_boundaries
  - threat_model
  - attack_paths
  - security_requirements
  - controls
  - validation
  - security_gate
  - operational_handoff
  - lessons_learned
  - redesign
hard_fail:
  - critical_threat_without_requirement
  - requirement_without_validation
  - critical_attack_path_without_detection_or_explicit_gap
  - unresolved_critical_design_flaw
  - unknown_presented_as_evidence
  - destructive_action_without_human_approval
  - incident_closed_without_root_cause_feedback
