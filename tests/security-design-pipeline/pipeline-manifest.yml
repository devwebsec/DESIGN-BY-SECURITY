version: "1.2"
name: security-design-pipeline
lifecycle:
  - DESIGN
  - BUILD
  - DEPLOY
  - DETECT
  - RESPOND
  - LEARN
  - REDESIGN
orchestrators:
  architecture: design-by-security
  operations: security-copilot-v4
contracts:
  architecture_to_operations: design-by-security/DESIGN-BY-SECURITY-ADAPTER.md
  operations_to_architecture: skills/security-copilot/DESIGN-BY-SECURITY-ADAPTER.md
required_artifacts:
  - intent
  - architecture
  - assets
  - data_flows
  - trust_boundaries
  - threat_model
  - attack_paths
  - security_requirements
  - controls
  - validation
  - dynamic_analysis
  - fuzzing
  - secure_build
  - evidence
  - security_gate
  - operational_handoff
  - lessons_learned
  - redesign
levels:
  level_4: semantic_relationship_validation
  level_5: mutation_metamorphic_evaluation
  level_6: bounded_property_graph_fuzzing
  level_7: security_graph_invariant_engine
  level_8: gost_r_56939_2024_process_overlay
hard_fail:
  - critical_threat_without_requirement
  - requirement_without_validation
  - critical_attack_path_without_detection_or_explicit_gap
  - unresolved_critical_design_flaw
  - unknown_presented_as_evidence
  - destructive_action_without_human_approval
  - incident_closed_without_root_cause_feedback
  - missing_required_process_artifact
  - broken_cross_reference
  - dynamic_analysis_processing_error_presented_as_pass
  - required_retest_missing
  - fuzzing_crash_without_analysis
  - secure_build_provenance_missing
  - secure_build_artifact_digest_missing
