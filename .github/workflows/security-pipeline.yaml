name: Security Design Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать вручную

permissions:
  contents: read
  pull-requests: write # Нужно для комментариев в PR

jobs:
  validate-design:
    name: Run Security Design Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Security Design Pipeline
        # Запускаем ваш проверенный скрипт
        run: bash tests/security-design-pipeline/run-pipeline.sh

      - name: Upload Pipeline Log
        # Сохраняем лог как артефакт, даже если пайплайн упал
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-pipeline-log
          path: pipeline.log

  vulnerability-scan:
    name: CVE Scan of security-copilot image
    runs-on: ubuntu-latest
    needs: [validate-design]
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # для загрузки SARIF в GitHub Security
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build security-copilot image
        run: |
          docker build -t security-copilot:ci-${{ github.sha }} .

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Run Trivy (full table for log)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'security-copilot:ci-${{ github.sha }}'
          format: 'table'
          output: 'trivy-report.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          ignore-unfixed: true

      - name: Run Trivy (SARIF, gate on CRITICAL/HIGH)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'security-copilot:ci-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-security-copilot'

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-report.txt
            trivy-results.sarif
          retention-days: 30
