name: Security Design Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-design:
    name: Run Security Design Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Security Design Pipeline
        run: bash tests/security-design-pipeline/run-pipeline.sh

      - name: Upload Pipeline Log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-pipeline-log
          path: pipeline.log
          if-no-files-found: warn
