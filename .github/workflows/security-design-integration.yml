name: Security Design Integration

on:
  push:
    branches: [main, 'integrate/**', 'hardening/**', 'audit/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: Design-by-Security ↔ Security Copilot v4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Static syntax validation
        run: |
          bash -n build-security-copilot.sh
          bash -n tests/security-design-pipeline/run-pipeline.sh
          python3 -m py_compile tests/security-design-pipeline/semantic/*.py tests/security-design-pipeline/graph/*.py

      - name: Validate skill archive, contracts and scenarios
        run: |
          bash tests/security-design-pipeline/run-pipeline.sh 2>&1 | tee pipeline.log
          exit ${PIPESTATUS[0]}

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-log
          path: pipeline.log
          if-no-files-found: error
          retention-days: 30
