name: Security Design Integration

on:
  push:
    branches: [main, 'integrate/**', 'hardening/**', 'devwebsec-claudefix-security-copilot-integration']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: Design-by-Security ↔ Security Copilot v4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Normalize repository text files for Linux CI
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name '*.sh' -o -name '*.py' -o -name '*.yml' -o -name '*.yaml' -o -name '*.json' \) -print0 |
            xargs -0 -r sed -i 's/\r$//'
          git diff --check

      - name: Validate Python sources
        run: |
          python3 -m py_compile \
            tests/security-design-pipeline/semantic/*.py \
            tests/security-design-pipeline/graph/*.py

      - name: Validate skill archive, contracts and scenarios
        run: |
          bash tests/security-design-pipeline/run-pipeline.sh 2>&1 | tee pipeline.log
          exit ${PIPESTATUS[0]}

      - name: Upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log
          path: pipeline.log
          retention-days: 30
