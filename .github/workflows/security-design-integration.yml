name: Security Design Integration

on:
  push:
    branches: [main, 'integrate/**', 'hardening/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-test:
    name: Design-by-Security ↔ Security Copilot v4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate skill archive, contracts and scenarios
        run: bash tests/security-design-pipeline/run-pipeline.sh

      - name: Validate builder syntax
        run: bash -n build-security-copilot.sh
