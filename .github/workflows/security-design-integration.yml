name: Security Design Integration

on:
  push:
    branches: [main, 'integrate/**', 'hardening/**', 'audit/**', 'devwebsec-claudefix-security-copilot-integration', 'feat/**', 'feature/**', 'deploy/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Development/PR security validation is intentionally non-blocking.
# Findings remain visible and are uploaded as evidence. The strict release gate
# lives in release-security-gate.yml and is never used as the development build gate.
jobs:
  integration-test:
    name: Design-by-Security ↔ Security Copilot v4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Repository hygiene
        run: |
          set -euo pipefail
          if git grep -Il $'\r' -- '*.sh' '*.py' '*.yml' '*.yaml' '*.json' '*.md' '*.txt'; then
            echo 'ERROR: CRLF line endings detected in repository text files' >&2
            exit 1
          fi
          git diff --check

      - name: Static syntax validation
        continue-on-error: true
        run: |
          set -euo pipefail
          bash -n build-security-copilot.sh
          bash -n apps/runtime-smoke.sh
          bash -n tests/security-design-pipeline/run-pipeline.sh
          bash -n gost-compliance/pipeline/gost-validate.sh
          bash -n gost-compliance/pipeline/evidence-package.sh
          python3 -m py_compile apps/server/server.py apps/cli/security_copilot.py tests/security-design-pipeline/semantic/*.py tests/security-design-pipeline/graph/*.py
          python3 -m json.tool schemas/security-design.schema.json >/dev/null

      - name: Validate internal deployment configuration
        continue-on-error: true
        run: |
          set -euo pipefail
          test -f deployment/internal/docker-compose.yml
          test -f deployment/internal/Caddyfile
          test -f deployment/internal/.env.example
          test -f deployment/internal/README.md
          test -f .gitignore
          grep -q '^SECURITY_COPILOT_API_TOKEN=replace-with-a-long-random-token$' deployment/internal/.env.example
          docker compose --env-file deployment/internal/.env.example \
            -f deployment/internal/docker-compose.yml config --format json >/tmp/security-copilot-compose.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('/tmp/security-copilot-compose.json').read_text())
          services = cfg.get('services', {})
          assert 'security-copilot' in services, 'security-copilot service missing'
          assert 'gateway' in services, 'gateway service missing'
          api = services['security-copilot']
          gateway = services['gateway']
          assert 'ports' not in api, 'API service must not publish host ports'
          assert {'8080'} <= set(api.get('expose', [])), 'API must expose port 8080 internally'
          assert api.get('healthcheck', {}).get('test'), 'API healthcheck must be defined'
          dependency = gateway.get('depends_on', {}).get('security-copilot', {})
          assert dependency.get('condition') == 'service_healthy', 'gateway must depend on API health'
          published = {str(p.get('published')) for p in gateway.get('ports', []) if isinstance(p, dict)}
          assert {'80', '443'} <= published, f'gateway must publish 80 and 443, got {published}'
          assert gateway.get('image') == 'caddy:2.10-alpine', 'unexpected gateway image'
          assert gateway.get('environment', {}).get('SECURITY_COPILOT_HOST') == 'security-copilot.internal'
          PY
          grep -q 'tls internal' deployment/internal/Caddyfile
          grep -q 'reverse_proxy security-copilot:8080' deployment/internal/Caddyfile
          grep -q 'redir https://' deployment/internal/Caddyfile

      - name: Runtime API smoke test
        continue-on-error: true
        run: |
          set -euo pipefail
          PORT=18080 bash apps/runtime-smoke.sh

      - name: Validate Docker image and runtime
        continue-on-error: true
        env:
          CI_RUNTIME_TOKEN: ci-test-token
        run: |
          set -euo pipefail
          docker build --file deployment/docker/Dockerfile --tag security-copilot:ci .
          docker image inspect security-copilot:ci >/dev/null
          docker run --rm -d --name security-copilot-ci \
            -p 18081:8080 \
            -e SECURITY_COPILOT_REQUIRE_AUTH=true \
            -e SECURITY_COPILOT_API_TOKEN="$CI_RUNTIME_TOKEN" \
            security-copilot:ci >/tmp/security-copilot-container-id
          cleanup() { docker logs security-copilot-ci || true; docker rm -f security-copilot-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18081/health >/dev/null
          test "$(curl -sS -o /tmp/container-unauthorized.json -w '%{http_code}' http://127.0.0.1:18081/api/v1/projects)" = "401"
          curl -fsS -H "Authorization: Bearer $CI_RUNTIME_TOKEN" http://127.0.0.1:18081/api/v1/projects >/tmp/container-authorized.json
          grep -q '"projects"' /tmp/container-authorized.json

      - name: Validate skill archive, contracts and scenarios
        continue-on-error: true
        run: |
          set -euo pipefail
          bash tests/security-design-pipeline/run-pipeline.sh 2>&1 | tee pipeline.log
          exit ${PIPESTATUS[0]}

      - name: Level 8 — GOST process overlay
        continue-on-error: true
        run: |
          set -euo pipefail
          bash gost-compliance/pipeline/gost-validate.sh 2>&1 | tee gost-validation.log
          exit ${PIPESTATUS[0]}

      - name: Build audit evidence package
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p evidence-output
          bash gost-compliance/pipeline/evidence-package.sh "$PWD/evidence-output/package"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-design-validation
          path: |
            pipeline.log
            gost-validation.log
            /tmp/security-copilot-runtime.log
            evidence-output/*.zip
            evidence-output/*.sha256
          if-no-files-found: warn
          retention-days: 30
