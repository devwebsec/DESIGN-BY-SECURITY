# .github/workflows/copilot-setup-steps.yml
# GitHub Copilot coding-agent environment preparation.
# This workflow is not part of the production CI/CD path.

name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/server/requirements.txt

      - name: Install repository dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip==26.2.0"
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f apps/server/requirements.txt ]; then
            python -m pip install -r apps/server/requirements.txt
          fi

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          bash -n build-security-copilot.sh
          bash -n apps/runtime-smoke.sh
          bash -n tests/security-design-pipeline/run-pipeline.sh
          bash -n gost-compliance/pipeline/gost-validate.sh
          bash -n gost-compliance/pipeline/evidence-package.sh

      - name: Compile Python sources
        run: |
          set -euo pipefail
          python -m py_compile apps/server/server.py apps/cli/security_copilot.py
          python -m py_compile tests/security-design-pipeline/semantic/*.py
          python -m py_compile tests/security-design-pipeline/graph/*.py

      - name: Build Docker image
        run: docker build -f deployment/docker/Dockerfile -t security-copilot:latest .

      - name: Smoke test API
        env:
          SECURITY_COPILOT_API_TOKEN: copilot-test-token
        run: |
          set -euo pipefail
          docker run -d --name sc-test -p 18082:8080 \
            -e SECURITY_COPILOT_REQUIRE_AUTH=true \
            -e SECURITY_COPILOT_API_TOKEN="$SECURITY_COPILOT_API_TOKEN" \
            security-copilot:latest
          cleanup() {
            docker logs sc-test || true
            docker rm -f sc-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18082/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18082/health
          test "$(curl -sS -o /tmp/sc-unauthorized.json -w '%{http_code}' http://127.0.0.1:18082/api/v1/projects)" = "401"
          curl -fsS -H "Authorization: Bearer $SECURITY_COPILOT_API_TOKEN" \
            http://127.0.0.1:18082/api/v1/projects >/tmp/sc-authorized.json
          grep -q '"projects"' /tmp/sc-authorized.json
